<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 220 220" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--d:0s;--k:1}
.o{transform-box:view-box;transform-origin:100px 100px}
.badge{animation:pop calc(.8s * var(--k)) cubic-bezier(.34,1.56,.64,1) var(--d) both}
.anillo{fill:none;stroke:#4dd0e1;stroke-width:2;stroke-dasharray:3 6;animation:gira 40s linear infinite}
.dibs{fill:none;stroke:#4dd0e1;stroke-width:6;stroke-linejoin:round;stroke-dasharray:1;animation:dibuja calc(1.2s * var(--k)) ease-out calc(var(--d) + .4s * var(--k)) both,brilla 3s ease-in-out calc(var(--d) + 1.6s * var(--k)) infinite}
.vara{fill:#fff;animation:aparece calc(.5s * var(--k)) ease calc(var(--d) + .9s * var(--k)) both}
.dib{stroke-dasharray:1;animation:dibuja calc(1s * var(--k)) ease-out calc(var(--d) + 1s * var(--k)) both}
.flujo{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 18;opacity:0;animation:vis calc(.6s * var(--k)) ease calc(var(--d) + 2s * var(--k)) forwards,flujo 2.4s linear calc(var(--d) + 2s * var(--k)) infinite}
.late{animation:late 3s ease-in-out calc(var(--d) + 1.8s * var(--k)) infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes dibuja{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@keyframes vis{to{opacity:.9}}
@keyframes flujo{to{stroke-dashoffset:-48}}
@keyframes brilla{0%,100%{stroke:#4dd0e1;stroke-width:6}50%{stroke:#b2ebf2;stroke-width:8}}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.badge,.anillo,.dibs,.vara,.dib,.flujo,.late{animation:none}.dibs,.dib{stroke-dasharray:none}}
</style>
<g class="o badge">
<circle cx="100" cy="100" r="96" fill="#0d2b4e"/>
<circle class="o anillo" cx="100" cy="100" r="90"/>
<g class="o late">
<g transform="translate(100 100) scale(.72) translate(-100 -100)">
<g>
<rect class="dibs" pathLength="1" x="82" y="12" width="36" height="176" rx="9"/>
<rect class="dibs" pathLength="1" x="82" y="12" width="36" height="176" rx="9" transform="rotate(60 100 100)"/>
<rect class="dibs" pathLength="1" x="82" y="12" width="36" height="176" rx="9" transform="rotate(120 100 100)"/>
</g>
<rect class="vara" x="93" y="14" width="14" height="172" rx="7"/>
<path class="dib" pathLength="1" d="M100 156 C142 146 142 122 100 114 C58 106 58 84 100 76 C128 70 130 56 108 48" fill="none" stroke="#0d2b4e" stroke-width="13" stroke-linecap="round"/>
<path class="dib" pathLength="1" d="M100 156 C142 146 142 122 100 114 C58 106 58 84 100 76 C128 70 130 56 108 48" fill="none" stroke="#4dd0e1" stroke-width="7" stroke-linecap="round"/>
<path class="flujo" d="M100 156 C142 146 142 122 100 114 C58 106 58 84 100 76 C128 70 130 56 108 48"/>
<circle cx="108" cy="46" r="8" fill="#4dd0e1" stroke="#0d2b4e" stroke-width="3"/>
<circle cx="110" cy="45" r="2" fill="#0d2b4e"/>
</g></g></g>
</svg>
