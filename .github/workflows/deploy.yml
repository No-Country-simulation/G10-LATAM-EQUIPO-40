name: Build and Deploy MediFlow

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'main.py'
      - 'streamlit_app.py'
      - 'Containerfile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to OCI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Podman image
        run: |
          podman build \
            -f Containerfile \
            -t "localhost/mediflow:${GITHUB_SHA}" \
            .

      - name: Export Podman image
        run: |
          podman save "localhost/mediflow:${GITHUB_SHA}" \
            | gzip > mediflow.tar.gz

      - name: Copy image to Oracle Cloud
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: mediflow.tar.gz
          target: ~/mediflow/

      - name: Deploy with health check and rollback
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu

            DEPLOY_DIR="$HOME/mediflow"
            NEW_IMAGE="localhost/mediflow:${IMAGE_TAG}"
            BACKUP_IMAGE_TAR="$DEPLOY_DIR/previous-image.tar.gz"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "Loading new image..."
            podman load -i mediflow.tar.gz

            HAS_PREVIOUS=0
            if podman container exists mediflow; then
              CURRENT_CONTAINER_IMAGE=$(podman inspect --format '{{.Config.Image}}' mediflow)
              echo "Creando backup físico de la imagen anterior ($CURRENT_CONTAINER_IMAGE)..."
              podman save "$CURRENT_CONTAINER_IMAGE" | gzip > "$BACKUP_IMAGE_TAR"
              HAS_PREVIOUS=1
            fi

            echo "Stopping previous container..."
            podman stop mediflow || true
            podman rm mediflow || true

            echo "Starting new container..."
            podman run -d \
              --name mediflow \
              --restart=unless-stopped \
              --env-file "$DEPLOY_DIR"/.env \
              -p 8501:8501 \
              "$NEW_IMAGE"

            echo "Waiting for application health..."

            HEALTHY=0
            for i in $(seq 1 30); do
              if podman exec mediflow python3 -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)" \
                >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi

              if ! podman container exists mediflow || \
                 [ "$(podman inspect -f '{{.State.Running}}' mediflow 2>/dev/null || echo false)" != "true" ]; then
                break
              fi

              sleep 2
            done

            if [ "$HEALTHY" -eq 1 ]; then
              echo "Deployment successful."
              rm -f mediflow.tar.gz "$BACKUP_IMAGE_TAR"
              podman ps --filter name=mediflow
              exit 0
            fi

            echo "Health check failed. Rolling back..."
            podman logs mediflow || true
            podman stop mediflow || true
            podman rm -f mediflow 2>/dev/null || true

            if [ "$HAS_PREVIOUS" -eq 1 ] && [ -f "$BACKUP_IMAGE_TAR" ]; then
              echo "Restoring previous image from backup..."
              
              RESTORED_IMAGE=$(podman load -i "$BACKUP_IMAGE_TAR" | awk '{print $NF}')
              echo "Image restored with reference: $RESTORED_IMAGE"
            
              podman run -d \
                --name mediflow \
                --restart=unless-stopped \
                --env-file "$DEPLOY_DIR"/.env \
                -p 8501:8501 \
                "$RESTORED_IMAGE"

              echo "Rollback executed successfully using backup image."
            else
              echo "No previous image backup available. Deployment failed."
            fi

            rm -f mediflow.tar.gz
            exit 1