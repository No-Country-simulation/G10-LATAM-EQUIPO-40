name: Build and Deploy MediFlow

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'main.py'
      - 'streamlit_app.py'
      - 'Containerfile'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to OCI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build Podman image
        run: |
          podman build \
            -f Containerfile \
            -t "localhost/mediflow:${GITHUB_SHA}" \
            .

      - name: Export Podman image
        run: |
          podman save "localhost/mediflow:${GITHUB_SHA}" \
            | gzip > mediflow.tar.gz

      - name: Copy image to Oracle Cloud
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: mediflow.tar.gz
          target: ~/mediflow/

      - name: Deploy with health check and rollback
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu

            DEPLOY_DIR="$HOME/mediflow"
            SERVICE="container-mediflow.service"
            NEW_IMAGE="localhost/mediflow:${IMAGE_TAG}"
            APP_IMAGE="localhost/mediflow-app"
            HEALTH_URL="http://127.0.0.1:8501/_stcore/health"
            
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            echo "Cleaning leftovers..."
            rm -rf /var/tmp/container_images_* 2>/dev/null || true
            podman image prune -f || true
            
            FREE_KB=$(df --output=avail /var/tmp | tail -1 | tr -d ' ')
            if [ "$FREE_KB" -lt 6000000 ]; then
              echo "ERROR: menos de 6 GB libres en /var/tmp. Abortando antes de cargar."
              df -h / /var/tmp
              exit 1
            fi
            
            echo "Loading new image..."
            podman load -i mediflow.tar.gz
            
            if podman image exists "$APP_IMAGE:latest" \
               && curl -fs --max-time 3 "$HEALTH_URL" >/dev/null 2>&1; then
              podman tag "$APP_IMAGE:latest" "$APP_IMAGE:previous"
            fi
            
            HAS_PREVIOUS=0
            if podman image exists "$APP_IMAGE:previous"; then
              HAS_PREVIOUS=1
            fi
            
            podman tag "$NEW_IMAGE" "$APP_IMAGE:latest"
            
            echo "Restarting service..."
            systemctl --user restart "$SERVICE"
            
            echo "Waiting for application health..."
            HEALTHY=0
            for i in $(seq 1 45); do
              if curl -fs --max-time 3 "$HEALTH_URL" >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            
            if [ "$HEALTHY" -eq 1 ]; then
              echo "Deployment successful."
              rm -f mediflow.tar.gz
            
              podman images --format '{{.Repository}}:{{.Tag}}' \
                | grep '^localhost/mediflow:' \
                | grep -v "$IMAGE_TAG" \
                | xargs -r podman rmi || true
            
              podman image prune -f || true
              exit 0
            fi
            
            echo "Health check failed. Rolling back..."
            journalctl --user -u "$SERVICE" -n 50 --no-pager || true
            
            if [ "$HAS_PREVIOUS" -eq 1 ]; then
              podman tag "$APP_IMAGE:previous" "$APP_IMAGE:latest"
              systemctl --user restart "$SERVICE"
              echo "Rollback executed using previous image."
            else
              echo "No previous image available."
            fi
            
            rm -f mediflow.tar.gz
            exit 1