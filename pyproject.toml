[project]
name = "mediflow"
version = "0.1.0"
description = "Agente Autónomo para Triaje, Extracción y Enrutamiento de Documentos Clínicos"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-classic>=1.0.8",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "python-dotenv>=1.2.3",
]
